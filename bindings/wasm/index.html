<!doctype html>
<!--
  Live browser demo for the WebAssembly build (issue #171). No server-side
  ForeFire, no NetCDF, no listenHTTP: the engine runs in this tab, in a worker.

  Copy forefire.mjs, forefire.wasm and worker.mjs next to this file and serve
  the directory over http — a file:// page can neither fetch the .wasm nor
  start a module worker:

      cp bindings/wasm/index.html bindings/wasm/worker.mjs bin/
      python3 -m http.server -d bin
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForeFire in the browser</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14100e;
        --panel: #1e1917;
        --line: #3a302c;
        --ink: #ede6e1;
        --dim: #9c8f88;
        --hot: #ff7a1a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1rem 4rem;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
        display: grid;
        gap: 1.5rem;
        grid-template-columns: minmax(0, 1fr) 17rem;
      }
      header {
        grid-column: 1 / -1;
      }
      h1 {
        margin: 0 0 0.3rem;
        font-size: 1.6rem;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 0;
        color: var(--dim);
        max-width: 44rem;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        background: #0b0908;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        padding: 0.9rem 1rem 1.1rem;
        margin: 0;
      }
      legend {
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0 0.4rem;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--dim);
        margin-top: 0.7rem;
      }
      label:first-of-type {
        margin-top: 0;
      }
      label span {
        color: var(--ink);
        float: right;
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
        margin: 0.3rem 0 0;
        accent-color: var(--hot);
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
      button {
        flex: 1;
        font: inherit;
        padding: 0.45rem 0.5rem;
        color: var(--ink);
        background: #2b2320;
        border: 1px solid var(--line);
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--hot);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.9rem;
        font-size: 13px;
        color: var(--dim);
      }
      .check input {
        accent-color: var(--hot);
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.25rem 1rem;
        font-family: ui-monospace, monospace;
        font-size: 12.5px;
      }
      dt {
        color: var(--dim);
      }
      dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 46rem) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>ForeFire in the browser</h1>
        <p>
          A 4 km square of uniform fuel, ignited at the centre. The solver runs
          in this tab, in a worker; the wind below is live, so steering it
          redirects the fire on the next step.
        </p>
      </header>

      <canvas id="view" width="900" height="900"></canvas>

      <aside>
        <fieldset>
          <legend>Run</legend>
          <div class="row">
            <button id="play" disabled>Loading engine…</button>
            <button id="reset" disabled>Reset</button>
          </div>
          <label
            >Step length <span id="dtOut">15 s</span>
            <input id="dt" type="range" min="5" max="60" step="5" value="15" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Wind</legend>
          <label
            >Speed <span id="speedOut">20 m/s</span>
            <input id="speed" type="range" min="0" max="40" step="1" value="20" />
          </label>
          <label
            >Direction <span id="dirOut">0°</span>
            <input id="dir" type="range" min="0" max="359" step="1" value="0" />
          </label>
          <div class="check">
            <input id="turning" type="checkbox" checked />
            <label for="turning" style="margin: 0">turn 12° per step</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>State</legend>
          <dl>
            <dt>sim time</dt>
            <dd id="mTime">0 s</dd>
            <dt>steps</dt>
            <dd id="mStep">0</dd>
            <dt>front nodes</dt>
            <dd id="mNodes">0</dd>
            <dt>fronts</dt>
            <dd id="mFronts">0</dd>
            <dt>ms / step</dt>
            <dd id="mMs">—</dd>
          </dl>
        </fieldset>
      </aside>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const canvas = $("view");
      const ctx = canvas.getContext("2d");

      const worker = new Worker("./worker.mjs", { type: "module" });

      let latest = null; // most recent frame from the worker
      let trail = []; // past perimeters, drawn fading
      let running = false;

      worker.onmessage = ({ data }) => {
        if (data.type === "ready") {
          $("play").textContent = "Run";
          $("play").disabled = false;
          $("reset").disabled = false;
          return;
        }
        if (data.type !== "frame") return;

        if (data.step === 0) trail = [];
        else if (latest) trail.push(latest.fronts);
        // The trail is decoration, not history — cap it so a long run does not
        // grow without bound.
        if (trail.length > 40) trail.shift();
        latest = data;
      };

      // Drawing is decoupled from stepping: the worker posts whenever a step
      // lands, the canvas repaints on its own rhythm.
      function frame() {
        if (latest) draw(latest);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      function draw(f) {
        const size = canvas.width;
        const s = size / f.domain;
        ctx.fillStyle = "#0b0908";
        ctx.fillRect(0, 0, size, size);

        // Canvas y grows downward, the domain's grows upward.
        const path = (coords) => {
          const p = new Path2D();
          for (let i = 0; i < coords.length; i += 2) {
            const x = coords[i] * s;
            const y = size - coords[i + 1] * s;
            i === 0 ? p.moveTo(x, y) : p.lineTo(x, y);
          }
          p.closePath();
          return p;
        };

        ctx.lineWidth = 1;
        trail.forEach((fronts, i) => {
          ctx.strokeStyle = `rgba(255,122,26,${0.06 + (i / trail.length) * 0.22})`;
          fronts.forEach((c) => ctx.stroke(path(c)));
        });

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#ffb066";
        ctx.fillStyle = "rgba(255,122,26,0.16)";
        f.fronts.forEach((c) => {
          const p = path(c);
          ctx.fill(p);
          ctx.stroke(p);
        });

        drawWind(f.wind, size);
      }

      function drawWind({ deg, speed }, size) {
        if (speed === 0) return;
        const cx = size - 84;
        const cy = 84;
        const r = 34 * (0.35 + (0.65 * speed) / 40);
        const rad = (deg * Math.PI) / 180;
        const dx = Math.cos(rad);
        const dy = -Math.sin(rad);

        ctx.save();
        ctx.strokeStyle = "rgba(237,230,225,0.5)";
        ctx.fillStyle = "rgba(237,230,225,0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - dx * r, cy - dy * r);
        ctx.lineTo(cx + dx * r, cy + dy * r);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + dx * r, cy + dy * r);
        ctx.lineTo(cx + dx * (r - 12) - dy * 7, cy + dy * (r - 12) + dx * 7);
        ctx.lineTo(cx + dx * (r - 12) + dy * 7, cy + dy * (r - 12) - dx * 7);
        ctx.fill();
        ctx.restore();
      }

      // Metrics update on their own timer: at 60 fps the numbers would be
      // unreadable, and they only change when a step lands anyway.
      setInterval(() => {
        if (!latest) return;
        $("mTime").textContent = `${latest.t.toFixed(0)} s`;
        $("mStep").textContent = latest.step;
        $("mNodes").textContent = latest.nodes;
        $("mFronts").textContent = latest.fronts.length;
        $("mMs").textContent = latest.ms ? latest.ms.toFixed(0) : "—";
      }, 250);

      $("play").addEventListener("click", () => {
        running = !running;
        worker.postMessage({ type: running ? "play" : "pause" });
        $("play").textContent = running ? "Pause" : "Run";
      });

      $("reset").addEventListener("click", () => {
        running = false;
        $("play").textContent = "Run";
        latest = null;
        trail = [];
        worker.postMessage({ type: "pause" });
        worker.postMessage({ type: "reset" });
      });

      const sendWind = () =>
        worker.postMessage({
          type: "wind",
          wind: {
            speed: +$("speed").value,
            angleDeg: +$("dir").value,
            turning: $("turning").checked,
          },
        });

      $("speed").addEventListener("input", () => {
        $("speedOut").textContent = `${$("speed").value} m/s`;
        sendWind();
      });
      $("dir").addEventListener("input", () => {
        $("dirOut").textContent = `${$("dir").value}°`;
        $("turning").checked = false;
        sendWind();
      });
      $("turning").addEventListener("change", sendWind);
      $("dt").addEventListener("input", () => {
        $("dtOut").textContent = `${$("dt").value} s`;
        worker.postMessage({ type: "dt", dt: +$("dt").value });
      });
    </script>
  </body>
</html>
